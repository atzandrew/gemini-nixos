# gemshell — the native Gemini PDA Wayland compositor + desktop shell.
#
# One binary: `gemshell`, the compositor (KMS/GBM + Mesa GL, wl_shm +
# xdg-shell, multitouch gestures, status bar, taskbar, launcher,
# workspaces, snapping). The settings panel is now an in-process egui
# overlay (see src/shell.rs), NOT a separate client — the old
# `gemsettings` wl_shm binary and its CPU-drawn UI were removed
# (2026-09-12).
#
# Workspace members: gemdata (trait), gemdata-device (real impl),
# gemdata-dummy (nested dev impl) and gemcli (device-control CLI, a
# frontend over gemdata-device — no logic of its own).
#
# Design + receipts: docs/gemshell.md. Build: pkgs/gemshell.nix
# (native aarch64 via the flake; x86_64 `cargo check` loop =
# bin/gemshell-host-check.sh).

[workspace]
resolver = "2"
members = [
    ".",
    "crates/gemdata",
    "crates/gemdata-device",
    "crates/gemdata-dummy",
    "crates/gemcli",
]
# gemshell.nix builds the workspace root; gemcli is built on demand with
# `-p gemcli` (pkgs/gemcli.nix).
default-members = ["."]

[package]
name = "gemshell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gemini PDA Wayland compositor + desktop shell (gemshell session)"

[[bin]]
name = "gemshell"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# gemcli is a small CLI — optimise it for size like it was before the
# workspace merge (per-package opt-level keeps gemshell at -O3).
[profile.release.package.gemcli]
opt-level = "s"

[dependencies]
# --- Wayland server (compositor) ---
# NOTE: the `system` (C libwayland) feature is enabled per-target below.
# macOS has no libwayland, and wayland-rs ships a pure-Rust backend it
# falls back to when `system` is off — which is what lets the compositor
# core compile on the Apple dev host (see src/platform/).
wayland-server = { version = "0.31", features = ["log"] }
wayland-protocols = { version = "0.32", features = ["client", "server", "unstable"] }
# (wayland-client is still needed by the nested-mode host connection)
wayland-client = { version = "0.31", features = ["log"] }
# --- keyboard ---
# (xkbcommon is linked directly via the hand-rolled FFI in
# src/compositor/input.rs + build.rs; the `xkbcommon` crate was unused.)
xkeysym = "0.2"
# --- misc ---
png = "0.17"
# SVG app icons — Adwaita/GNOME/COSMIC ship most app icons as SVG only.
# Rendered lazily per used icon (text support off: app icons are paths).
resvg = { version = "0.45", default-features = false }
ab_glyph = "0.2"
libc = "0.2"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
# --- GUI (immediate-mode, GPU-tessellated) ---
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
# --- system-data abstraction (trait + device/dummy impls) ---
gemdata = { path = "crates/gemdata" }
gemdata-device = { path = "crates/gemdata-device" }
gemdata-dummy = { path = "crates/gemdata-dummy" }

# ---------------------------------------------------------------------------
# Platform-specific dependencies (the only place the OS is selected here;
# the code itself goes through the `platform` traits).
# ---------------------------------------------------------------------------

# Linux keeps the system libwayland backend (unchanged device/nested
# behaviour).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-server = { version = "0.31", features = ["system", "log"] }
wayland-client = { version = "0.31", features = ["system", "log"] }

# macOS preview backend: a native Cocoa window + desktop-OpenGL context.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
# glutin 0.31's context builder takes a raw-window-handle 0.5 handle.
raw-window-handle = "0.5"
